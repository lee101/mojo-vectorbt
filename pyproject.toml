[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-vectorbt"
version = "0.1.0"
description = "Mojo kernels for vectorbt's compute-heavy array operations"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
